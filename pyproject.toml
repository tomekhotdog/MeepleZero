[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcassonne"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "numpy>=2.0"]

[project.optional-dependencies]
# torch>=2.4 has no wheels for Intel macOS (x86_64); install `.[ml]` on a supported platform.
ml = ["torch>=2.4"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
carcassonne = "carcassonne.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["carcassonne"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
