[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcassonne"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "numpy>=1.26,<2"]

[project.optional-dependencies]
# torch>=2.3 dropped Intel-macOS (x86_64) wheels; 2.2.x is the last line with them.
# The Raspberry Pi 5 (aarch64 Linux) can take newer torch — bump there if desired.
ml = ["torch>=2.2,<2.3"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
carcassonne = "carcassonne.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["carcassonne"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Import layering (core -> game -> agents/nn -> training/web -> cli) is enforced by
# tests/test_layering.py, not ruff: TID251 bans named APIs everywhere and cannot
# express per-layer allow-lists.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
