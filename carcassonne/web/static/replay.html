<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carcassonne — replay</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <nav id="topnav">
      <span class="brand">Carcassonne</span>
      <a href="/">Play</a>
      <a href="/replay" aria-current="page">Replays</a>
      <a href="/training">Training</a>
    </nav>
    <div id="app" class="replay">
      <!-- Left column: replay picker + (future) move list. -->
      <aside id="move-rail">
        <div class="panel">
          <label class="panel-title" for="replay-select">Replay</label>
          <select id="replay-select" aria-label="Choose a replay">
            <option value="">Loading…</option>
          </select>
          <div id="replay-error" class="error" role="alert"></div>
        </div>
        <div id="move-list"></div>
      </aside>

      <!-- Centre column: board with the scrubber directly beneath it. -->
      <main id="stage">
        <canvas id="board"></canvas>
        <div id="empty-hint">Pick a replay to begin.</div>

        <div class="panel" id="scrubber" hidden>
          <div class="scrub-head">
            <span id="position" class="mono">move 0 / 0</span>
            <button id="play" type="button" aria-label="Play / pause" title="Play / pause (space)">▶</button>
          </div>
          <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Move" />
          <div class="scrub-buttons">
            <button id="first" type="button" title="First (Home)">⏮</button>
            <button id="prev" type="button" title="Previous (←)">◀</button>
            <button id="next" type="button" title="Next (→)">▶</button>
            <button id="last" type="button" title="Last (End)">⏭</button>
          </div>
        </div>
      </main>

      <!-- Right column: per-move analysis and whole-game analysis. -->
      <aside id="analysis">
        <section id="this-move">
          <div class="panel-title section-label">This move</div>

          <div class="panel" id="move-info" hidden>
            <div id="move-who"></div>
            <div id="move-detail" class="mono"></div>
            <div id="move-delta"></div>
          </div>

          <div class="panel search-panel" id="search-panel" hidden>
            <div class="panel-title">Network prior vs search visits</div>
            <div id="search-value" class="mono ai"></div>
            <div id="search-meta" class="mono muted"></div>
            <div id="search-bars"></div>
            <div id="search-note" class="muted"></div>
          </div>

          <!-- Placeholder: future alternatives toggle. -->
          <div id="alt-toggle-slot"></div>
        </section>

        <section id="this-game">
          <div class="panel-title section-label">This game</div>

          <div class="panel" id="winprob-panel" hidden>
            <div class="panel-title">Win probability — <span class="p0-name mono"></span></div>
            <canvas id="winprob" aria-label="Win probability across the game"></canvas>
            <div id="winprob-axis" class="mono muted"></div>
          </div>

          <!-- Placeholders: future whole-game panels. -->
          <div id="score-panel" hidden></div>
          <div id="deck-panel" hidden></div>
          <div id="supply-panel" hidden></div>
        </section>
      </aside>
    </div>

    <script type="module" src="/static/replay.js"></script>
  </body>
</html>
